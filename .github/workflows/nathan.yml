name: Nathan's pipeline

# Run the build for every pushed branch.
on:
  push:

jobs:
  build:
    # This runner must have Docker installed and available to the workflow.
    runs-on: self-hosted

    steps:
      # Make the repository available to the build job.
      - name: Checkout
        uses: actions/checkout@v4

      # Mount the checked-out repository into the Gradle container, use it as
      # the working directory, and run the build (including the unit tests).
      - name: Build with Gradle
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app gradle:jdk21 gradle build

      - name: Check path
        run: |
          ls -alh build/libs

      - name: Build docker image
        run: docker build -f Dockerfile.nathan -t demo-nathan .

      - name: Stop old docker container
        run: docker stop demo-nathan
        continue-on-error: true

      - name: Remove old container
        run: docker rm demo-nathan
        continue-on-error: true

      - name: Run docker container
        run: docker run -d --name demo-nathan -p 8082:8080 --restart unless-stopped demo-nathan:latest

      - name: Clean up unused Docker images
        if: always()
        run: docker image prune -f
