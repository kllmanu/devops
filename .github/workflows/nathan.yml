name: Nathan's pipeline
on:
  push:
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with Gradle
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/app" \
            -w /app \
            gradle:jdk21 \
            gradle build
      - name: SonarQube scan
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli
      - name: Check build output
        run: ls -alh build/libs
      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.nathan \
            -t demo-nathan:latest .
      - name: Tag Docker image
        run: |
          docker tag demo-nathan:latest \
            10.0.40.171:5000/team8/demo-nathan:${{ github.sha }}
          docker tag demo-nathan:latest \
            10.0.40.171:5000/team8/demo-nathan:latest
      - name: Push Docker image
        run: |
          docker push \
            10.0.40.171:5000/team8/demo-nathan:${{ github.sha }}
          docker push \
            10.0.40.171:5000/team8/demo-nathan:latest
      - name: Remove old container
        run: docker rm -f demo-nathan || true
      - name: Deploy application
        run: |
          docker run -d \
            --name demo-nathan \
            -p 8082:8080 \
            --restart unless-stopped \
            demo-nathan:latest
      - name: Wait for application
        run: sleep 30
      - name: Integration test
        run: |
          curl --fail --silent http://localhost:8082 | grep "running"
      - name: Clean up unused Docker images
        if: always()
        run: docker image prune -f
